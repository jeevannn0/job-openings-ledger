name: Refresh job ledger

on:
  schedule:
    # UTC. The refresh slots are 00:00, 03:00, ... 21:00 IST (minute 30 UTC). An external clock dispatches
    # a run 15 minutes before each slot (mode=slot) and that run waits for the slot's exact time. GitHub
    # fires cron ticks late at busy times and sometimes not at all, so this cron is only the fallback: the
    # tick 10 minutes before a slot arms it if the clock did not, the tick 5 minutes after a slot serves it
    # if its check is still unpublished, and a tick that finds an older run active does nothing.
    - cron: "20,35 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "now = refresh at once; slot = act like a tick (wait for the next slot if it is close)"
        type: choice
        options: [now, slot]
        default: now
  # A human push to the default branch takes the publish-only path below: it re-renders and deploys
  # the committed state without contacting any employer site. The refresh job's own commit is pushed
  # with GITHUB_TOKEN, which never triggers `push`, and the publish job also refuses the bot actor.
  push:

permissions: {}

# One refresh, publish or deploy at a time (job-level, see each job). The gate stays outside the group so
# a tick that arrives while a run is armed decides at once instead of queueing behind it.

jobs:
  gate:
    # schedule always runs on the default branch (its payload has no repository object);
    # manual runs are limited to the default branch so state is only ever pushed there.
    # Pushes never refresh sources; they take the publish job instead.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
      until: ${{ steps.due.outputs.until }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (tag verified with git ls-remote)
        with:
          persist-credentials: false

      # An older scheduled or manual run that is still active (armed and waiting, or crawling) already
      # serves the slot; this tick then does nothing. Newer runs are ignored so two ticks never both yield.
      - name: Count older runs still active
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          n="$(gh run list --workflow refresh.yml --limit 20 --json databaseId,status,event \
                --jq "[.[] | select(.databaseId < $RUN_ID and .status != \"completed\"
                       and (.event == \"schedule\" or .event == \"workflow_dispatch\"))] | length")"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # Refresh now (latest slot unpublished, or a manual run), wait for the next slot (a tick within the
      # schedule lead), or nothing to do. The decision and times go to the step summary.
      - name: Decide what this tick does
        id: due
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'now' }}
          ACTIVE: ${{ steps.active.outputs.count }}
        run: python3 scripts/refresh.py due --event "$EVENT" --mode "$MODE" --active-runs "$ACTIVE" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  refresh:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.due == 'true'
    concurrency:
      group: job-ledger-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75    # up to the schedule lead waiting for the slot, the run budget, then ~9 min for tests/render/commit
    outputs:
      alert: ${{ steps.build.outputs.alert }}   # this run's alert payload on one line, for the notify job
    permissions:
      contents: write   # persist state/jobs.json and index.html
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (tag verified with git ls-remote)
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Sender tests
        run: node --test scripts/push.test.mjs scripts/island.test.mjs

      - name: Verify index.html matches state
        run: python3 scripts/refresh.py check   # fails loudly if index.html was edited outside the state

      # Tests and checks are done before the slot; the refresh itself starts on the slot's exact minute.
      - name: Wait for the slot
        env:
          UNTIL: ${{ needs.gate.outputs.until }}
        run: python3 scripts/refresh.py wait --until "$UNTIL"

      - name: Refresh public sources
        id: refresh
        env:
          # Private exclusions; read by the script only, never echoed. Unset or malformed fails the run.
          EXCLUDED_PUBLIC_IDS_JSON: ${{ secrets.EXCLUDED_PUBLIC_IDS_JSON }}
        # The run outcome (public job keys and counts) goes to the runner temp dir, outside the repo and the artifact.
        run: >-
          python3 scripts/refresh.py refresh --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          --outcome "$RUNNER_TEMP/refresh-outcome.json"

      - name: Public-boundary scan
        run: python3 scripts/refresh.py scan

      - name: Build Pages artifact
        id: build
        run: |
          set -euo pipefail
          python3 scripts/refresh.py render --out dist/index.html
          cmp dist/index.html index.html
          cp manifest.webmanifest icon-180.png icon-192.png icon-512.png widget/k9-widget.js dist/
          # Phone alert for this run; fails (and so blocks the deploy) if the outcome does not match the state.
          python3 scripts/refresh.py alert --outcome "$RUNNER_TEMP/refresh-outcome.json" --out dist/alerts.json \
            --ledger-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          # The Home Screen widget's feed: the newest openings and the counts, from the state just committed.
          python3 scripts/refresh.py widget --out dist/widget.json
          test "$(ls -A dist | tr '\n' ' ')" = "alerts.json icon-180.png icon-192.png icon-512.png index.html k9-widget.js manifest.webmanifest widget.json "
          # The same public payload on one line, for the notify job below.
          printf 'alert=%s\n' "$(python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' dist/alerts.json)" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed state
        if: steps.refresh.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AS_OF: ${{ steps.refresh.outputs.as_of }}
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | grep -v -E '^ M (state/jobs\.json|index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit: unexpected working-tree changes" >&2
            exit 1
          fi
          if git diff --quiet -- state/jobs.json index.html; then
            exit 0
          fi
          git add -- state/jobs.json index.html
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh job ledger ${AS_OF}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          # Plain fast-forward push; if the remote advanced the push fails and nothing is forced. One retry
          # after 30 s covers a GitHub-side hiccup (4 Nov 2026: "remote: Internal Server Error" lost a slot).
          push() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
                push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          }
          push || { echo "push failed; retrying once in 30 s" >&2; sleep 30; push; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0 (tag verified with git ls-remote)
        with:
          path: dist

  publish:
    # Publish-only path for code/template changes: no network access to any source, no commit.
    # The committed index.html must already match the committed state (the check step), so this
    # job only proves the tree is consistent and ships it.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.actor != 'github-actions[bot]'
    concurrency:
      group: job-ledger-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (tag verified with git ls-remote)
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Sender tests
        run: node --test scripts/push.test.mjs scripts/island.test.mjs

      - name: Verify index.html matches state
        run: python3 scripts/refresh.py check

      - name: Public-boundary scan
        run: python3 scripts/refresh.py scan

      - name: Build Pages artifact from the committed state
        run: |
          set -euo pipefail
          python3 scripts/refresh.py render --out dist/index.html
          cmp dist/index.html index.html
          cp manifest.webmanifest icon-180.png icon-192.png icon-512.png widget/k9-widget.js dist/
          # The phone alert describes the latest source refresh, which this path does not repeat, so the
          # live copy is carried forward unchanged. It must parse, pass the alert checks, and describe the
          # committed state's own checked_at; otherwise the run fails and nothing is deployed.
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 -o dist/alerts.json \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/alerts.json"
          python3 scripts/refresh.py alert-verify dist/alerts.json
          # The widget feed depends on the committed state alone, so this path rebuilds it.
          python3 scripts/refresh.py widget --out dist/widget.json
          test "$(ls -A dist | tr '\n' ' ')" = "alerts.json icon-180.png icon-192.png icon-512.png index.html k9-widget.js manifest.webmanifest widget.json "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0 (tag verified with git ls-remote)
        with:
          path: dist

  deploy:
    needs: [refresh, publish]
    # Exactly one of the two producers runs per event; deploy follows whichever succeeded.
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.publish.result == 'success') }}
    concurrency:
      group: job-ledger-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20    # two deployment attempts of up to 8 min each
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0 (tag verified with git ls-remote)

      # A Pages deployment occasionally hangs on GitHub's side (6 Nov 2026 00:00 IST: the refresh had committed,
      # the deploy sat for 10 min, the job timed out, the site stayed on old data for 3 h). Give one attempt 8 min,
      # then deploy the same artifact once more rather than losing the slot.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1 (tag verified with git ls-remote)
        with:
          timeout: 480000

      - name: Deploy again
        id: again
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1 (tag verified with git ls-remote)
        with:
          timeout: 480000

  notify:
    # Once a refresh is live, tell the registered phones when it found new openings: scripts/push.mjs reads the
    # registry (the ledger's own Worker, with PUSH_STORE_KEY), sends a Web Push message to the push service each
    # device names, and drops devices the service reports gone (they register again when the ledger is next opened
    # on them). Separate from deploy so the Pages deployment keeps its own permissions.
    needs: [refresh, deploy]
    # always(): on scheduled runs the publish job is skipped, and GitHub skips every job downstream of a skipped
    # job unless its condition says otherwise; a deploy that failed or timed out must not swallow the notification
    # either (6 Nov 2026 00:00 IST), since the refresh itself is committed and the next deploy publishes it.
    # The refresh must have succeeded: its alert output is the message.
    if: ${{ always() && needs.refresh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (tag verified with git ls-remote)
        with:
          persist-credentials: false

      - name: Send the phone notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_STORE_KEY: ${{ secrets.PUSH_STORE_KEY }}
          ALERT: ${{ needs.refresh.outputs.alert }}
        run: node scripts/push.mjs --alert-env ALERT --ledger-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Update the Dynamic Island
        # The Live Activity on the reader's iPhone (Lock Screen card and Dynamic Island), drawn by PushWard from
        # the same alert payload: scripts/island.mjs. Independent of the notification above, so it still runs
        # when that step failed; without the PUSHWARD_KEY secret the script says so and does nothing.
        if: ${{ !cancelled() }}
        env:
          PUSHWARD_KEY: ${{ secrets.PUSHWARD_KEY }}
          ALERT: ${{ needs.refresh.outputs.alert }}
        run: node scripts/island.mjs --alert-env ALERT --ledger-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
